name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '17'
          cache: maven

      - name: Build release JAR
        run: mvn clean package -DskipTests

      - name: Prepare release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp jimuqu-admin/target/jimuqu-admin.jar "release/jimuqu-admin-${TAG}.jar"
          git archive --format=zip --prefix="jimuqu-admin-${TAG}/" -o "release/jimuqu-admin-${TAG}-source.zip" HEAD
          git archive --format=tar.gz --prefix="jimuqu-admin-${TAG}/" -o "release/jimuqu-admin-${TAG}-source.tar.gz" HEAD
          cd release
          sha256sum * > SHA256SUMS

      - name: Build frontend bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/chengliang4810/jimuqu-admin-ui.git frontend-src
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          cd frontend-src
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          cp -R frontend-src/dist frontend-dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
