name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cross-platform-verify:
    name: Cross-platform full stack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      JIMU_TEST_SERVER_PORT: 15320
      JIMU_TEST_FRONTEND_DIR: ${{ github.workspace }}/frontend
      JIMU_TEST_MYSQL_HOST: 127.0.0.1
      JIMU_TEST_MYSQL_PORT: 3306
      JIMU_TEST_MYSQL_USER: jimu_ci
      JIMU_TEST_MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
      JIMU_TEST_REDIS_HOST: 127.0.0.1
      JIMU_TEST_REDIS_PORT: 6379
      JIMU_TEST_REDIS_DB: 15
      JIMU_TEST_REDIS_PASSWORD: ""
      JIMU_PLAYWRIGHT_INSTALL_DEPS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend

      - uses: actions/checkout@v4
        with:
          repository: chengliang4810/jimuqu-admin-ui
          ref: main
          path: frontend

      # 使用与项目编译基线一致的 JDK 21，避免 Maven 在 Java 17 下无法加载 Java 21 字节码。
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Start MySQL 8.4
        uses: ankane/setup-mysql@19fbb7ee54446ac7f3aed34db192ec70dbec6092 # v1
        with:
          mysql-version: "8.4"
          user: jimu_ci

      - name: Start Redis 7
        if: runner.os != 'Windows'
        uses: shogo82148/actions-setup-redis@abd15d4028c04b9a6ea7917f1f3d931c14b6871f # v1.54.0
        with:
          redis-version: "7.0"

      - name: Start Redis-compatible service on Windows
        if: runner.os == 'Windows'
        run: choco install memurai-developer --version=4.1.8 --yes --no-progress --accept-license

      - name: Prepare isolated CI datastores
        working-directory: backend
        run: |
          node --check script/test-fullstack.mjs
          node --check script/prepare-ci-datastores.mjs
          node script/prepare-ci-datastores.mjs

      - name: Verify complete full stack
        working-directory: backend
        run: node script/test-fullstack.mjs

  release:
    needs: cross-platform-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jimuqu_release_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-${{ github.run_id }}-${{ github.run_attempt }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      JIMU_TEST_SERVER_PORT: 15320
      JIMU_TEST_MYSQL_HOST: 127.0.0.1
      JIMU_TEST_MYSQL_PORT: 3306
      JIMU_TEST_MYSQL_DATABASE: jimuqu_release_test
      JIMU_TEST_MYSQL_USER: root
      JIMU_TEST_MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      JIMU_TEST_REDIS_HOST: 127.0.0.1
      JIMU_TEST_REDIS_PORT: 6379
      JIMU_TEST_REDIS_DB: 15
      JIMU_TEST_REDIS_PASSWORD: ""
      JIMU_TEST_REDIS_PREFIX: "jimu:it:${{ github.run_id }}:${{ github.run_attempt }}:"
      JIMU_TEST_OSS_DOMAIN: http://127.0.0.1:15320/file/
      JIMU_TEST_OSS_PATH: ./target/release-test-oss
      JIMU_SSE_HEARTBEAT_INTERVAL: 1000
      JIMU_JUSTAUTH_ENABLED: true
      JIMU_JUSTAUTH_GITEE_CLIENT_ID: http-contract-client
      JIMU_JUSTAUTH_GITEE_CLIENT_SECRET: http-contract-secret
      JIMU_JUSTAUTH_GITEE_REDIRECT_URI: http://127.0.0.1:15555/social-callback?source=gitee
      JIMU_OSS_DOMAIN: http://127.0.0.1:15320/file/
      JIMU_OSS_PATH: ./target/release-test-oss
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: backend

      - uses: actions/checkout@v4
        with:
          repository: chengliang4810/jimuqu-admin-ui
          ref: main
          path: frontend

      # 发布构建同样使用 JDK 21，确保验证结果与最终产物运行时一致。
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install full-stack test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-mysql-client redis-tools

      - name: Calculate release version
        working-directory: backend
        run: echo "RELEASE_VERSION=v$(TZ=Asia/Shanghai git show -s --format=%cd --date=format-local:%Y.%m.%d $GITHUB_SHA)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Verify full stack and build release JAR
        working-directory: backend
        env:
          JIMU_TEST_FRONTEND_DIR: ${{ github.workspace }}/frontend
          JIMU_PLAYWRIGHT_INSTALL_DEPS: "true"
        run: node script/test-fullstack.mjs

      - name: Prepare release assets
        working-directory: backend
        run: |
          mkdir release
          cp jimuqu-admin/target/jimuqu-admin.jar release/jimuqu-admin.jar
          git archive --format=zip --prefix=jimuqu-admin/ -o release/jimuqu-admin-source.zip HEAD
          git archive --format=tar.gz --prefix=jimuqu-admin/ -o release/jimuqu-admin-source.tar.gz HEAD
          cd release
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: backend/release/*
