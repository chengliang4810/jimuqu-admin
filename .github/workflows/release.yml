name: Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '17'
          cache: maven

      - name: Calculate release version
        run: echo "RELEASE_VERSION=v$(TZ=Asia/Shanghai date +%Y.%m.%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build release JAR
        run: mvn clean package -DskipTests

      - name: Prepare release assets
        run: |
          mkdir release
          cp jimuqu-admin/target/jimuqu-admin.jar release/jimuqu-admin.jar
          git archive --format=zip --prefix=jimuqu-admin/ -o release/jimuqu-admin-source.zip HEAD
          git archive --format=tar.gz --prefix=jimuqu-admin/ -o release/jimuqu-admin-source.tar.gz HEAD
          cd release
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          target_commitish: dev
          generate_release_notes: true
          files: release/*
