name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '17'
          cache: maven

      - name: Build release JAR
        run: mvn clean package -DskipTests

      - name: Prepare release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp jimuqu-admin/target/jimuqu-admin.jar "release/jimuqu-admin-${TAG}.jar"
          git archive --format=zip --prefix="jimuqu-admin-${TAG}/" -o "release/jimuqu-admin-${TAG}-source.zip" HEAD
          git archive --format=tar.gz --prefix="jimuqu-admin-${TAG}/" -o "release/jimuqu-admin-${TAG}-source.tar.gz" HEAD
          cd release
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
