# 数据库配置
solon.dataSources.jimuqu!: #数据源（!结尾表示 typed=true）
  class: "org.noear.solon.data.dynamicds.DynamicDataSource"
  strict: true #严格模式（指定的源不存时：严格模式会抛异常；非严格模式用默认源）
  default: "master" #指定默认数据源
  master:
    dataSourceClassName: "com.zaxxer.hikari.HikariDataSource"
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: "${JIMU_DB_URL:jdbc:mysql://127.0.0.1:3306/jimuqu_db?useUnicode=true&characterEncoding=utf8&autoReconnect=true&rewriteBatchedStatements=true}"
    # 生产环境必须显式提供数据库凭据，禁止回退到仓库内置账号或密码。
    username: "${JIMU_DB_USERNAME}"
    password: "${JIMU_DB_PASSWORD}"
#  slave:
#    dataSourceClassName: "com.zaxxer.hikari.HikariDataSource"
#    driverClassName: com.mysql.cj.jdbc.Driver
#    jdbcUrl: "${JIMU_SLAVE_DB_URL:jdbc:mysql://127.0.0.1:3306/jimuqu_db?useUnicode=true&characterEncoding=utf8&autoReconnect=true&rewriteBatchedStatements=true}"
#    username: "${JIMU_SLAVE_DB_USERNAME}"
#    password: "${JIMU_SLAVE_DB_PASSWORD}"

# 自动维护表结构；生产环境首次连接空库时同样自动建表并执行初始化数据脚本。
auto-table:
  # none | validate | create | update: https://autotable.tangzc.com/%E9%85%8D%E7%BD%AE.html
  mode: update

