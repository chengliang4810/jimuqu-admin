# 自动维护表结构
auto-table:
  # none | validate ｜ create ｜ update) https://autotable.tangzc.com/%E9%85%8D%E7%BD%AE.html
  # 系统启动时，会检查数据库中的表与 java 实体类是否匹配。如果不匹配，则启动失败。
  mode: validate

