# 数据库配置
solon.dataSources.jimuqu!: #数据源（!结尾表示 typed=true）
  class: "org.noear.solon.data.dynamicds.DynamicDataSource"
  strict: true #严格模式（指定的源不存时：严格模式会抛异常；非严格模式用默认源）
  default: "master" #指定默认数据源
  master:
    dataSourceClassName: "com.zaxxer.hikari.HikariDataSource"
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://${JIMU_DB_HOST}:${JIMU_DB_PORT}/${JIMU_DB_NAME}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&rewriteBatchedStatements=true
    username: ${JIMU_DB_USER}
    password: ${JIMU_DB_PASSWORD}
#  slave:
#    dataSourceClassName: "com.zaxxer.hikari.HikariDataSource"
#    driverClassName: com.mysql.cj.jdbc.Driver
#    jdbcUrl: jdbc:mysql://mariadb:3306/jimuqu_db?useUnicode=true&characterEncoding=utf8&autoReconnect=true&rewriteBatchedStatements=true
#    username: jimuqu
#    password: P@ssw0rd

# 自动维护表结构
auto-table:
  # none | validate ｜ create ｜ update) https://autotable.tangzc.com/%E9%85%8D%E7%BD%AE.html
  # 系统启动时，会检查数据库中的表与 java 实体类是否匹配。如果不匹配，则启动失败。
  mode: validate

#开启redis缓存配置, 自动覆盖 app.yml的配置
jimuqu.cache:
  driverType: "redis"
  server: "${JIMU_REDIS_HOST}:${JIMU_REDIS_PORT}"
  db: ${JIMU_REDIS_DB}
  password: ${JIMU_REDIS_PASSWORD}

dromara:
  x-file-storage:
    local-plus:
      - platform: default
        domain: ${JIMU_OSS_DOMAIN}
        storage-path: ${JIMU_OSS_PATH}/
