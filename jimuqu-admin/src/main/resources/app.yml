# common配置，非必要情况下不用修改
# 多数情况下是将配置的默认值写出来方便修改，所以看起来多
# server配置
server.port: 5320
captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数学计算 char 字符验证
  type: math
  numberLength: 1
  charLength: 4
# 微信小程序登录默认关闭；可配置多个 apps 条目，或替换 MiniProgramIdentityAdapter。
auth:
  mini-program:
    enabled: ${JIMU_MINI_PROGRAM_ENABLED:false}
    endpoint: "${JIMU_MINI_PROGRAM_ENDPOINT:https://api.weixin.qq.com/sns/jscode2session}"
    apps:
      default:
        appid: "${JIMU_MINI_PROGRAM_APPID:}"
        secret: "${JIMU_MINI_PROGRAM_SECRET:}"
# Bell 6.X API 请求解密与响应加密配置。
api-decrypt:
  enabled: true
  headerFlag: encrypt-key
  publicKey: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDm6u8q8X78onmbU4wGMq3b4ufbWE18YzuWo5jwkUlwWPTPcENbZYtveyTepp2Od1CTDcjhTUmVYvFkhaCF46UfOxZrwoSZc3jf3WXXd0hLOPBHuulynknj2KsWvKDuRig7J2o4KbDhyl0nnlUiMrIiD0tv1rBKpNCJ/T+MN0bERQIDAQAB
  privateKey: 
# 防止 XSS 攻击；公告正文允许保存富文本。
xss:
  enabled: true
  excludeUrls:
    - /system/notice
# 项目基线为 Java 21，启用虚拟线程以提升阻塞式 I/O 场景的并发能力。
solon.threads.virtual.enabled: true

solon:
  # 应用环境配置
  env: @profiles.active@
  # 应用配置
  app:
    #应用名称
    name: jimuqu-admin
    #应用标题
    title: "积木区-Admin"
    #应用组
    group: "jimuqu"
    # 版本
    version: @revision@

# 线上环境支持外部配置
---
solon.env.on: prod
solon.config.add: "./app.yml"
---

# 批量加载内部配置
solon.config.load:
  - "config/*.yml"

# 记录器级别的配置示例
solon.logging.logger:
  # redis连接时的日志
  "org.redisson.connection":
    level: WARN
  # 修改日志级别
  "com.zaxxer.hikari":
    level: WARN

# security url放行配置
security:
  # 排除路径
  excludes:
    - /
    # 登录
    - /auth/login

# Jimu 的在线会话、缓存监控与集群消息依赖 Redis。
jimuqu.cache:
  driverType: "redis"
  server: "${JIMU_REDIS_SERVER:127.0.0.1:6379}"
  db: ${JIMU_REDIS_DB:0}
  password: ${JIMU_REDIS_PASSWORD:}
  keyHeader: "${JIMU_REDIS_PREFIX:jimuqu}"

# 限流配置
jimuqu:
  # 定时任务集群协调配置。
  scheduling:
    # 周期认领租约时长（毫秒）；健康实例会按三分之一租期自动续租。
    claimLeaseMs: ${JIMU_SCHEDULING_CLAIM_LEASE_MS:30000}
    # 数据库任务定义与本机调度器的周期对账间隔（毫秒）。
    reconcileIntervalMs: ${JIMU_SCHEDULING_RECONCILE_INTERVAL_MS:30000}
    # 单个节点允许同时提交的手动立即执行任务数量，必须大于零。
    manualMaxConcurrent: ${JIMU_SCHEDULING_MANUAL_MAX_CONCURRENT:16}
  ratelimit:
    # 是否启用限流
    enabled: true
    # 以下为默认限流配置，注解未指定则使用默认配置
    # 限流类型：IP-IP限流，USER-用户限流，GLOBAL-全局限流
    type: IP
    # 每秒生成令牌数
    permitsPerSecond: 10.0
    # 最大突发请求数
    maxBurst: 100
    # 限流时间窗口（秒）
    window: 60
    # 限流算法：TOKEN_BUCKET, SLIDING_WINDOW, FIXED_WINDOW
    algorithm: TOKEN_BUCKET
    # 限流键前缀
    keyPrefix: "rate_limit:"
    # 限流失败时的错误消息
    errorMessage: "访问过于频繁，请稍候再试"

# 表自动配置
auto-table:
  # 是否启用自动表结构维护
  enable: true
  # 是否显示banner
  show-banner: false
  # 自定义的索引前缀
  index-prefix: idx_
  # 自动删除数据库中多余的列
  auto-drop-column: false
  # 自动删除数据库中多余的索引
  auto-drop-index: false
  # 数据库不存在自动创建
  auto-build-database: true
  mysql:
    table-default-charset: utf8mb4
    table-default-collation: utf8mb4_unicode_ci
  # update(默认)：系统启动时，会自动判断哪些表是新建的，哪些字段要新增修改，哪些索引/约束要新增删除等。
  mode: update
  # 自动建库或预建空库首次建表后，由 AutoTable 自动执行初始化数据脚本。
  init-data:
    enable: true
    base-path: classpath:sql/{dialect}
    # 默认脚本与数据源专属的 jimuqu.sql 必须不同，避免同一文件执行两次。
    default-init-file-name: default
  # 记录表信息维护过程中执行的SQL
  recordSql:
    enable: true
    # 记录方式，默认是数据库，可选文件(file)方式 custom方式(已实现flyway规范的SQL记录，类：RecordSqlFlywayHandler)
    # 文件方式管理可通过git进行版本管理记录
    recordType: file
    # 当前SQL的版本，建议指定，会体现在数据库的字段或者文件名上
    version: ${revision}
    # 记录文件的路径
    folderPath: ./db/sql

# OSS配置
dromara:
  x-file-storage: #文件存储配置
    default-platform: default # 默认使用的平台标识，对应下方 platform
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    enable-multipart-file-wrapper: false #是否启用多文件包装器
    enable-http-servlet-request-file-wrapper: false
    local-plus: # local-plus代表x-file-storage中的平台类型，不可以随意更改
      - platform: default # 存储平台标识，用户自定义的标识
        enable-storage: true  #启用存储
        enable-access: true #启用访问（线上请使用 Nginx 配置，效率更高）
        domain: "${JIMU_OSS_DOMAIN:/file/}" # 默认同源访问；独立文件域名可通过环境变量覆盖，且必须以“/”结尾
        base-path: local-plus/ # 基础路径
        path-patterns: /file/ # 访问路径
        storage-path: "${JIMU_OSS_PATH:./data/oss/}" # 默认使用跨平台相对目录；生产环境可通过环境变量覆盖
#    minio: # minio 存储类型的使用方式
#      - platform: minio-user # 存储平台标识
#        enable-storage: true  # 启用存储
#        access-key: j9rMyECcmNH0lNBqPfOo
#        secret-key: 0NYFJSl4D8msuxHirenthXA4lvju4c3QNdmQ29Ob
#        end-point: http://127.0.0.1:9000
#        bucket-name: user
#        #        domain: ?? # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
#        base-path: user/ # 基础路径
#      - platform: minio-dept # 存储平台标识
#        enable-storage: true  # 启用存储
#        access-key: j9rMyECcmNH0lNBqPfOo
#        secret-key: 0NYFJSl4D8msuxHirenthXA4lvju4c3QNdmQ29Ob
#        end-point: http://127.0.0.1:9000
#        bucket-name: dept
#        #        domain: ?? # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
#        base-path: dept/ # 基础路径

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/message
  # 是否开启心跳，避免代理或 CDN 在无业务消息时断开连接
  heartbeat: true
  # 心跳间隔 60S
  heartbeatInterval: ${JIMU_SSE_HEARTBEAT_INTERVAL:60000}

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: true
  # 路径
  path: /resource/websocket
  # 失效会话清理周期（毫秒）
  heartbeatInterval: ${JIMU_WEBSOCKET_HEARTBEAT_INTERVAL:60000}

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 是否打印http log
  http-log: false
  # 是否打印banner
  is-print: false
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: 您的accessKey
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # JustAuth 社交登录（Bell 账户绑定页使用以下来源）
justauth:
  enabled: ${JIMU_JUSTAUTH_ENABLED:false}
  address: "${JIMU_JUSTAUTH_ADDRESS:http://localhost:5666}"
  type:
    gitee:
      client-id: "${JIMU_JUSTAUTH_GITEE_CLIENT_ID:}"
      client-secret: "${JIMU_JUSTAUTH_GITEE_CLIENT_SECRET:}"
      redirect-uri: "${JIMU_JUSTAUTH_GITEE_REDIRECT_URI:http://localhost:5666/social-callback?source=gitee}"
    github:
      client-id: "${JIMU_JUSTAUTH_GITHUB_CLIENT_ID:}"
      client-secret: "${JIMU_JUSTAUTH_GITHUB_CLIENT_SECRET:}"
      redirect-uri: "${JIMU_JUSTAUTH_GITHUB_REDIRECT_URI:http://localhost:5666/social-callback?source=github}"
    maxkey:
      server-url: "${JIMU_JUSTAUTH_MAXKEY_SERVER_URL:}"
      client-id: "${JIMU_JUSTAUTH_MAXKEY_CLIENT_ID:}"
      client-secret: "${JIMU_JUSTAUTH_MAXKEY_CLIENT_SECRET:}"
      redirect-uri: "${JIMU_JUSTAUTH_MAXKEY_REDIRECT_URI:http://localhost:5666/social-callback?source=maxkey}"
    topiam:
      server-url: "${JIMU_JUSTAUTH_TOPIAM_SERVER_URL:}"
      client-id: "${JIMU_JUSTAUTH_TOPIAM_CLIENT_ID:}"
      client-secret: "${JIMU_JUSTAUTH_TOPIAM_CLIENT_SECRET:}"
      redirect-uri: "${JIMU_JUSTAUTH_TOPIAM_REDIRECT_URI:http://localhost:5666/social-callback?source=topiam}"
      scopes: [openid, email, phone, profile]
    gitea:
      server-url: "${JIMU_JUSTAUTH_GITEA_SERVER_URL:}"
      client-id: "${JIMU_JUSTAUTH_GITEA_CLIENT_ID:}"
      client-secret: "${JIMU_JUSTAUTH_GITEA_CLIENT_SECRET:}"
      redirect-uri: "${JIMU_JUSTAUTH_GITEA_REDIRECT_URI:http://localhost:5666/social-callback?source=gitea}"
    wechat:
      client-id: "${JIMU_JUSTAUTH_WECHAT_CLIENT_ID:}"
      client-secret: "${JIMU_JUSTAUTH_WECHAT_CLIENT_SECRET:}"
      redirect-uri: "${JIMU_JUSTAUTH_WECHAT_REDIRECT_URI:http://localhost:5666/social-callback?source=wechat}"
