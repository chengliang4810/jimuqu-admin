# common配置，非必要情况下不用修改
# 多数情况下是将配置的默认值写出来方便修改，所以看起来多
# server配置
server.port: 5320
# Java21 虚拟线程
solon.threads.virtual.enabled: true

solon:
  # 应用环境配置
  env: @profiles.active@
  # 应用配置
  app:
    #应用名称
    name: jimuqu-admin
    #应用标题
    title: "积木区-Admin"
    #应用组
    group: "jimuqu"
    # 版本
    version: @revision@

# 线上环境支持外部配置
---
solon.env.on: prod
solon.config.add: "./app.yml"
---

# 批量加载内部配置
solon.config.load:
  - "config/*.yml"

# 记录器级别的配置示例
solon.logging.logger:
  # redis连接时的日志
  "org.redisson.connection":
    level: WARN
  # 修改日志级别
  "com.zaxxer.hikari":
    level: WARN

# security url放行配置
security:
  # 排除路径
  excludes:
    - /
    # 登录
    - /auth/login

# 本地缓存
jimuqu.cache:
  driverType: "local" #缓存类型
  keyHeader: "jimuqu"

# 限流配置
jimuqu:
  ratelimit:
    # 是否启用限流
    enabled: true
    # 以下为默认限流配置，注解未指定则使用默认配置
    # 限流类型：IP-IP限流，USER-用户限流，GLOBAL-全局限流
    type: IP
    # 每秒生成令牌数
    permitsPerSecond: 10.0
    # 最大突发请求数
    maxBurst: 100
    # 限流时间窗口（秒）
    window: 60
    # 限流算法：TOKEN_BUCKET, SLIDING_WINDOW, FIXED_WINDOW
    algorithm: TOKEN_BUCKET
    # 限流键前缀
    keyPrefix: "rate_limit:"
    # 限流失败时的错误消息
    errorMessage: "请求过于频繁，请稍后再试"

# 表自动配置
auto-table:
  # 是否启用自动表结构维护
  enable: true
  # 是否显示banner
  show-banner: false
  # 自定义的索引前缀
  index-prefix: idx_
  # 自动删除数据库中多余的列
  auto-drop-column: false
  # 自动删除数据库中多余的索引
  auto-drop-index: false
  # 数据库不存在自动创建
  auto-build-database: true
  # update(默认)：系统启动时，会自动判断哪些表是新建的，哪些字段要新增修改，哪些索引/约束要新增删除等。
  mode: update
  # 初始化数据配置
  init-data:
    # 是否开启初始化数据功能
    enable: true
    # 初始化数据文件名，默认是_init_.sql
    default-init-file-name: jimuqu.sql
    # 初始化数据文件路径
    base-path: classpath:sql/{dialect}
  # 记录表信息维护过程中执行的SQL
  recordSql:
    enable: true
    # 记录方式，默认是数据库，可选文件(file)方式 custom方式(已实现flyway规范的SQL记录，类：RecordSqlFlywayHandler)
    # 文件方式管理可通过git进行版本管理记录
    recordType: file
    # 当前SQL的版本，建议指定，会体现在数据库的字段或者文件名上
    version: ${revision}
    # 记录文件的路径
    folderPath: ./db/sql

# OSS配置
dromara:
  x-file-storage: #文件存储配置
    default-platform: local-plus #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    enable-multipart-file-wrapper: false #是否启用多文件包装器
    enable-http-servlet-request-file-wrapper: false
    local-plus: # local-plus代表x-file-storage中的平台类型，不可以随意更改
      - platform: default # 存储平台标识，用户自定义的标识
        enable-storage: true  #启用存储
        enable-access: true #启用访问（线上请使用 Nginx 配置，效率更高）
        domain: http://127.0.0.1:5320/file/ # 访问域名，例如：“http://127.0.0.1:8030/file/”，注意后面要和 path-patterns 保持一致，“/”结尾，本地存储建议使用相对路径，方便后期更换域名
        base-path: local-plus/ # 基础路径
        path-patterns: /file/ # 访问路径
        storage-path: D:/temp/ # 存储路径
#    minio: # minio 存储类型的使用方式
#      - platform: minio-user # 存储平台标识
#        enable-storage: true  # 启用存储
#        access-key: j9rMyECcmNH0lNBqPfOo
#        secret-key: 0NYFJSl4D8msuxHirenthXA4lvju4c3QNdmQ29Ob
#        end-point: http://127.0.0.1:9000
#        bucket-name: user
#        #        domain: ?? # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
#        base-path: user/ # 基础路径
#      - platform: minio-dept # 存储平台标识
#        enable-storage: true  # 启用存储
#        access-key: j9rMyECcmNH0lNBqPfOo
#        secret-key: 0NYFJSl4D8msuxHirenthXA4lvju4c3QNdmQ29Ob
#        end-point: http://127.0.0.1:9000
#        bucket-name: dept
#        #        domain: ?? # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
#        base-path: dept/ # 基础路径

gen:
  # 作者
  author: chengliang4810
  # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
  packageName: com.jimuqu.system
  # 自动去除表前缀，默认是false
  autoRemovePre: false
  # 表前缀（生成类名不会包含表前缀，多个用逗号分隔）
  tablePrefix: sys_
  # 使用的模版 vue
  platform: vue

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse
  # 是否开启心跳，使用CDN情况下后端无消息会自动断开连接
  heartbeat: false
  # 心跳间隔 10S
  heartbeatInterval: 10000

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: 您的accessKey
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0