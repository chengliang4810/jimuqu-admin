# Test infrastructure values are injected by script/test-fullstack.ps1.
server.port: ${JIMU_TEST_SERVER_PORT}
solon.threads.virtual.enabled: false

sse:
  heartbeatInterval: 1000

captcha:
  enable: false

auth:
  verification:
    local-code: "1234"

# 使用与生产相同的 JustAuth 调用链，仅将外部 Gitee 提供器替换为本地确定性响应。
justauth:
  enabled: true
  type:
    gitee:
      client-id: "http-contract-client"
      client-secret: "http-contract-secret"
      redirect-uri: "http://127.0.0.1:15555/social-callback?source=gitee"
      local-code: "http-contract-code"
      local-user-id: "http-contract-user"
      local-username: "http_contract_social"
      local-nickname: "HTTP Contract Social"
      local-email: "http-contract-social@jimuqu.test"

solon.dataSources.jimuqu!:
  class: "org.noear.solon.data.dynamicds.DynamicDataSource"
  strict: true
  default: "master"
  master:
    dataSourceClassName: "com.zaxxer.hikari.HikariDataSource"
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    jdbcUrl: jdbc:p6spy:mysql://${JIMU_TEST_MYSQL_HOST}:${JIMU_TEST_MYSQL_PORT}/${JIMU_TEST_MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&autoReconnect=false&rewriteBatchedStatements=true
    username: ${JIMU_TEST_MYSQL_USER}
    password: ${JIMU_TEST_MYSQL_PASSWORD}

jimuqu.cache:
  driverType: "redis"
  server: "${JIMU_TEST_REDIS_HOST}:${JIMU_TEST_REDIS_PORT}"
  db: ${JIMU_TEST_REDIS_DB}
  password: ${JIMU_TEST_REDIS_PASSWORD:}
  keyHeader: ${JIMU_TEST_REDIS_PREFIX}

jimuqu:
  ratelimit:
    enabled: false

auto-table:
  enable: true
  auto-build-database: true
  auto-drop-column: false
  auto-drop-index: false
  recordSql:
    enable: false

dromara:
  x-file-storage:
    default-platform: default
    thumbnail-suffix: ".min.jpg"
    enable-multipart-file-wrapper: false
    enable-http-servlet-request-file-wrapper: false
    local-plus:
      - platform: default
        enable-storage: true
        enable-access: true
        domain: ${JIMU_TEST_OSS_DOMAIN}
        base-path: local-plus/
        path-patterns: /file/
        storage-path: "${JIMU_TEST_OSS_PATH}/"
