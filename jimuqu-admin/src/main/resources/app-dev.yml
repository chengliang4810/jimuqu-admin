#    password: P@ssw0rd

# 可选的Redis配置， 不加则使用本地缓存
#jimuqu.cache:
#  driverType: "redis" #驱动类型
#  server: "127.0.0.1:6379"
#  db: 0 #默认为 0，可不配置
#  #password:

# 表自动配置 注意删除列会导致列数据一起删除，如果比较敏感请自行关闭配置
auto-table:
  # 自动删除数据库中多余的列
  auto-drop-column: false
  # 自动删除数据库中多余的索引
  auto-drop-index: false

# 记录器级别的配置示例
solon.logging.logger:
  # 关闭autotable的输出日志，默认是INFO级别
  "org.dromara.autotable.core.utils.DBHelper":
    level: WARN
  "org.dromara.autotable.core":
    level: WARN
